<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsiaformS</title>
<style>
  :root{
    --wa-dark:#075E54;
    --wa-teal:#128C7E;
    --wa-green:#25D366;
    --wa-light-green:#DCF8C6;
    --wa-bg:#ECE5DD;
    --wa-panel:#FFFFFF;
    --wa-text:#0B141A;
    --wa-subtext:#54656F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
    background: var(--wa-bg);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 1px, transparent 1px),
      radial-gradient(circle at 65% 65%, rgba(255,255,255,0.4) 1px, transparent 1px);
    background-size: 60px 60px, 90px 90px;
    color: var(--wa-text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }

  .card{
    width:100%;
    max-width:460px;
    background: var(--wa-panel);
    border-radius: 18px;
    box-shadow: 0 20px 50px rgba(7,94,84,0.18);
    overflow:hidden;
  }

  .topbar{
    background: linear-gradient(135deg, var(--wa-dark), var(--wa-teal));
    padding: 32px 20px 44px;
    text-align:center;
    position:relative;
  }

  .topbar::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:24px;
    background: var(--wa-panel);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .logo-wrap{
    background:#fff;
    display:inline-block;
    padding: 16px 26px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    max-width: 100%;
  }

  .logo-wrap img{
    display:block;
    height: 78px;
    width:auto;
    max-width: 100%;
  }

  .content{
    padding: 8px 28px 32px;
    text-align:center;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background: var(--wa-light-green);
    color: var(--wa-dark);
    font-size: 13px;
    font-weight:600;
    padding: 6px 14px;
    border-radius: 20px;
    margin-top: -18px;
    margin-bottom: 18px;
  }

  .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--wa-green);
    box-shadow: 0 0 0 3px rgba(37,211,102,0.25);
  }

  h1{
    font-size: 24px;
    line-height:1.3;
    color: var(--wa-text);
    margin-bottom: 10px;
  }

  p.sub{
    font-size: 15px;
    color: var(--wa-subtext);
    line-height:1.5;
    margin-bottom: 26px;
  }

  .bubble{
    background: var(--wa-light-green);
    border-radius: 14px 14px 14px 2px;
    padding: 14px 18px;
    text-align:left;
    font-size: 14.5px;
    color: var(--wa-text);
    margin-bottom: 26px;
    position:relative;
  }

  .bubble .time{
    display:block;
    text-align:right;
    font-size: 11px;
    color: var(--wa-subtext);
    margin-top: 6px;
  }

  .cta{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    background: var(--wa-green);
    color:#fff;
    text-decoration:none;
    font-size: 17px;
    font-weight:700;
    padding: 16px 20px;
    border-radius: 50px;
    box-shadow: 0 10px 24px rgba(37,211,102,0.4);
    transition: transform .15s ease, box-shadow .15s ease;
  }

  .cta:hover{
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(37,211,102,0.5);
  }

  .cta svg{ width:22px; height:22px; flex-shrink:0; }

  .footer-note{
    margin-top: 18px;
    font-size: 12.5px;
    color: var(--wa-subtext);
  }
</style>
</head>
